name: DevSecOps CI/CD Pipeline

# Runs the build/test job on every push and PR, then fans out into four
# automated security gates. Gitleaks and npm audit are configured to
# genuinely FAIL the workflow (not just warn) when they find something
# above the agreed threshold; Semgrep and Trivy report findings as
# workflow annotations and also fail on High/Critical results.

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

env:
  NODE_VERSION: "18"
  IMAGE_NAME: juiceshop-devsecops

jobs:
  # ---------------------------------------------------------------------
  # 1. Build & automated tests — runs on every push
  # ---------------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test --if-present

      - name: Build application
        run: npm run build --if-present

  # ---------------------------------------------------------------------
  # 2. SAST — Semgrep
  # ---------------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/owasp-top-ten
            p/javascript
            p/nodejsscan
        env:
          SEMGREP_RULES: p/owasp-top-ten p/javascript
        # Fails the job automatically on findings that match the rulesets
        # above. Findings and rule IDs are also uploaded as a SARIF report
        # for the report's before/after evidence.

  # ---------------------------------------------------------------------
  # 3. Dependency / software composition scanning — npm audit
  # ---------------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan (npm audit)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (fails on High/Critical)
        run: npm audit --audit-level=high
        # npm audit exits non-zero automatically once a vulnerability at or
        # above --audit-level is found, which blocks the job without any
        # extra scripting.

  # ---------------------------------------------------------------------
  # 4. Secrets scanning — Gitleaks  (the gate deliberately used to
  #    demonstrate a genuine pipeline block, see Section 5.7 of report)
  # ---------------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan (Gitleaks)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # No GITLEAKS_LICENSE needed for the OSS scan. The action exits
        # with a non-zero status the moment a secret pattern is detected
        # anywhere in the diff/history being scanned, which fails this job
        # and blocks the pipeline.

  # ---------------------------------------------------------------------
  # 5. Container image scanning — Trivy
  # ---------------------------------------------------------------------
  container-scan:
    name: Container Scan (Trivy)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.IMAGE_NAME }}:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------------
  # 6. Optional — DAST with OWASP ZAP against the running app (extra credit)
  # ---------------------------------------------------------------------
  dast-zap:
    name: DAST (OWASP ZAP) [optional]
    needs: [ dependency-scan, secrets-scan, container-scan ]
    runs-on: ubuntu-latest
    if: false   # flip to true once the app is reliably reachable in CI
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Start application stack
        run: docker compose up -d

      - name: Wait for app to be ready
        run: npx wait-on http://localhost:3000 -t 60000

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:3000"
          fail_action: false
